<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/active.css">
    <script src="./script.js"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand">Jett McHugh Word Project</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../ResumePageHW/Resume.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://github.com/UnciaCoding?tab=repositories">GitHub</a>
                    </li>
                </ul>
                <!-- Dark Mode Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-custom2 dropdown-toggle" type="button" id="themeDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-moon-fill"></i> Theme
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="themeDropdown">
                        <li><a class="dropdown-item" href="#" id="lightTheme"><i class="bi bi-sun-fill"></i> Light Mode</a></li>
                        <li><a class="dropdown-item" href="#" id="darkTheme"><i class="bi bi-moon-fill"></i> Dark Mode</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    <section class="py-1 text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Jett McHugh</h1>
            <p class="lead">CISC 3610 Word Project</p>
            <div style="text-align: center;">
                <img src="../images/Lotus_transparent.png" alt="Purple lotus" width="100">
            </div>
        </div>
    </section>
    <div class="row justify-content-center mt-2">
        <div class="col-md-10">
            <div class="card my-4 mx-auto" style="background-color: var(--bs-bg-1);">
                <div class="card-body">
                    <div style="text-align: center;">
                        <select id="wordSelect" onchange="syncWord()">
                            <option value="">-- Choose a Word --</option>
                            <option value="Miami" data-temp="Miami">Miami</option>
                            <option value="Supercalifragilisticexpialidocious" data-temp="Supercalifragilisticexpialidocious">Supercalifragilisticexpialidocious</option>
                            <option value="Rural" data-temp="Rural">Rural</option>
                            <option value="Mischievous" data-temp="Mischievous">Mischievous</option>
                            <option value="Colonel" data-temp="Colonel">Colonel</option>
                            <option value="Epitome" data-temp="Epitome">Epitome</option>
                            <option value="Draught" data-temp="Draught">Draught</option>
                            <option value="Hyperbole" data-temp="Hyperbole">Hyperbole</option>
                        </select>
                        <input type="text" id="wordDisplay" readonly>
                        <button onclick="speakWord()">Speak Text</button>
                    </div>
                </div>
            </div>
            <div class="card my-4 mx-auto">
                <div class="card-body">
                    <h2>Text to Speech</h2>
                    <textarea id="text" rows="10" cols="50" placeholder="Enter your text here..."></textarea><br><br>
                    <button onclick="speakText()">Speak Text</button>
                </div>
            </div>
        </div>
    </div>
    <hr>
    <div style="text-align: center;">
        <img src="../images/Lotus_transparent.png" alt="Purple lotus" width="100">
    </div>
    <script>
        // Dark mode functionality
        const lightThemeBtn = document.getElementById('lightTheme');
        const darkThemeBtn = document.getElementById('darkTheme');
        const html = document.documentElement;
        const navbar = document.querySelector('.navbar');

        // Check for saved theme preference
        const currentTheme = localStorage.getItem('theme') || 'light';
        setTheme(currentTheme);

        lightThemeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            setTheme('light');
            localStorage.setItem('theme', 'light');
        });

        darkThemeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            setTheme('dark');
            localStorage.setItem('theme', 'dark');
        });

        function setTheme(theme) {
            html.setAttribute('data-bs-theme', theme);

            // Update navbar classes
            if (theme === 'dark') {
                navbar.classList.remove('navbar-light', 'bg-light');
                navbar.classList.add('navbar-dark', 'bg-dark');
            } else {
                navbar.classList.remove('navbar-dark', 'bg-dark');
                navbar.classList.add('navbar-light', 'bg-light');
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
